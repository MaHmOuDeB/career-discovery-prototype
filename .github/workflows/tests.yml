name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -B -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tests -v
      - name: Demo
        run: python -B -m career_discovery demo
      - name: Help
        run: python -B -m career_discovery --help
